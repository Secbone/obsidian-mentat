name: Release Obsidian Plugin

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed

jobs:
  build:
    # Only run when CI passed and was triggered by a version tag (starts with digit)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      contains(github.event.workflow_run.head_branch, '.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Validate Tag Format
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "⏭️ Skipping: '$TAG' is not a version tag."
            exit 1
          fi
          echo "✅ Version tag detected: $TAG"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Plugin
        run: npm run build

      - name: Validate Release Assets
        run: |
          if [ ! -f main.js ]; then
            echo "❌ main.js was not built!"
            exit 1
          fi
          if [ ! -f manifest.json ]; then
            echo "❌ manifest.json is missing!"
            exit 1
          fi
          if [ ! -f styles.css ]; then
            echo "❌ styles.css is missing!"
            exit 1
          fi
          echo "✅ All release assets are present."

      - name: Extract Version from Manifest
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate Tag Matches Manifest Version
        run: |
          MANIFEST_VERSION=${{ steps.get_version.outputs.VERSION }}
          TAG_VERSION=${{ github.event.workflow_run.head_branch }}
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   manifest.json version: $MANIFEST_VERSION"
            echo "   Tag version: $TAG_VERSION"
            exit 1
          fi
          echo "✅ Version matches perfectly ($TAG_VERSION)."

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.workflow_run.head_branch }}
          allowUpdates: true
          artifacts: 'main.js,manifest.json,styles.css'
          body: |
            ## 🧠 Mentat v${{ steps.get_version.outputs.VERSION }} Release
            
            This is an automated release for Mentat—your local agentic cognitive partner for Obsidian.
            
            ### 📦 Files included:
            * `main.js`: Compiled production bundle.
            * `manifest.json`: Plugin description and metadata.
            * `styles.css`: Custom UI styles and themes.
            
            To install:
            1. Download the assets.
            2. Copy them into your vault's plugin directory: `<vault>/.obsidian/plugins/mentat/`.
            3. Enable Mentat in Obsidian's Community Plugins settings.
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
